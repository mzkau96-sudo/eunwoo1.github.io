steps:
  # 1단계: 프로그램에 이상이 없는지 컴퓨터 코드를 테스트합니다.
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['install']
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['test']

  # 2단계: 내 소스 코드를 구글 공장 전용 패키지(도커 이미지)로 포장합니다.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/the-patient-alpha-repo/api-engine:$COMMIT_SHA', '.']

  # 3단계: 포장된 패키지를 구글 안전 보관소(Artifact Registry)에 저장합니다.
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/the-patient-alpha-repo/api-engine:$COMMIT_SHA']

  # 4단계: 사람들이 접속할 수 있도록 서울 리전 서버(Cloud Run)에 최종 출시합니다.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'the-patient-alpha-api'
      - '--image=asia-northeast3-docker.pkg.dev/$PROJECT_ID/the-patient-alpha-repo/api-engine:$COMMIT_SHA'
      - '--region=asia-northeast3'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'asia-northeast3-docker.pkg.dev/$PROJECT_ID/the-patient-alpha-repo/api-engine:$COMMIT_SHA'
  
